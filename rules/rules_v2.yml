# rules/rules_v2.yml
version: 2
rules:
  - { code: RULE-001, severity: HIGH, message: "보증금 반환 기한 없음",        when: { field: confirmation_date, op: missing } }
  - { code: RULE-002, severity: MED,  message: "전입신고 여부 불명확",        when: { field: resident_reported, op: none } }
  - { code: RULE-003, severity: LOW,  message: "관리비 포함/별도 불명확",      when: { field: maintenance_fee.included, op: none } }
  - { code: RULE-004, severity: MED,  message: "관리비 금액 미기재",          when: { field: maintenance_fee.amount, op: none } }
  - { code: RULE-005, severity: HIGH, message: "과도한 원상복구 부담 가능성", when: { field: restoration_clause, op: contains, value: "과도한 부담" } }
  - { code: RULE-006, severity: MED,  message: "원상복구 조항 없음",          when: { field: restoration_clause, op: none } }
  - { code: RULE-007, severity: HIGH, message: "과도한 위약(잔여월세 전액)",  when: { field: termination_penalty, op: contains, value: "잔여월세 전액" } }
  - { code: RULE-008, severity: MED,  message: "위약 관련 조항 없음",         when: { field: termination_penalty, op: none } }
  - { code: RULE-009, severity: LOW,  message: "서명/날인 키워드 없음",        when: { field: signature_detected, op: eq, value: false } }
  - { code: RULE-010, severity: LOW,  message: "표 미검출(금액/기간 표기 확인)", when: { field: tables_found, op: eq, value: 0 } }

  # 가독성/포함 키워드 기반(문장에 특정 키워드 있으면 알림)
  - { code: RULE-011, severity: MED,  message: "지연이자율 미기재",            when: { text_kw: ["지연이자", "지연 이자"], op: missing_kw } }
  - { code: RULE-012, severity: MED,  message: "관리비 정산 방식 불명확",      when: { text_kw: ["정산", "정산방법", "정산 방식"], op: missing_kw } }
  - { code: RULE-013, severity: MED,  message: "수선/하자 책임 불명확",         when: { text_kw: ["수선의무", "하자보수"], op: missing_kw } }
  - { code: RULE-014, severity: MED,  message: "원상복구 기준 불명확",         when: { text_kw: ["원상복구", "원상 회복"], op: missing_kw } }
  - { code: RULE-015, severity: MED,  message: "중도해지 절차/통지 불명확",     when: { text_kw: ["중도해지", "해지 통지"], op: missing_kw } }
  - { code: RULE-016, severity: LOW,  message: "임대차보증보험 안내 없음",      when: { text_kw: ["임대차보증보험", "보증보험"], op: missing_kw } }
  - { code: RULE-017, severity: LOW,  message: "전대/양도 제한 규정 없음",      when: { text_kw: ["전대", "재임대", "양도"], op: missing_kw } }
  - { code: RULE-018, severity: LOW,  message: "열쇠/인도 시점 불명확",        when: { text_kw: ["열쇠", "인도", "점유 이전"], op: missing_kw } }
  - { code: RULE-019, severity: LOW,  message: "관리규약 준수 조항 없음",       when: { text_kw: ["관리규약", "규정 준수"], op: missing_kw } }
  - { code: RULE-020, severity: LOW,  message: "분쟁 해결 절차 없음",           when: { text_kw: ["분쟁", "조정", "중재", "관할법원"], op: missing_kw } }
